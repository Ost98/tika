# IFT3913 - Tache 2
# Execute les tests de tika-core (originaux, generes par ChatUniTest, ecrits a la main)
# puis l'analyse de mutation pitest sur EndianUtils, MediaType et Patterns.
# ChatUniTest n'est PAS execute ici (il exige Ollama en local) : les tests generes
# sont commites dans tika-core/src/test/java.

name: tache2 - tests et mutation (tika-core)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests-et-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compiler tika-core et executer tous ses tests
        run: ./mvnw -B -pl tika-core -am install

      - name: Executer uniquement les tests generes (*_Test) et manuels (*MutationTest)
        run: ./mvnw -B -pl tika-core surefire:test -Dtest='*_Test,*MutationTest'

      - name: Analyse de mutation (pitest)
        run: ./mvnw -B -pl tika-core org.pitest:pitest-maven:mutationCoverage

      - name: Resume du score de mutation
        if: always()
        run: |
          CSV=tika-core/target/pit-reports/mutations.csv
          if [ -f "$CSV" ]; then
            {
              echo "## Score de mutation (tests originaux + generes + manuels)"
              echo ""
              echo "| Classe | Mutants | Tues | Survivants | Score |"
              echo "|---|---|---|---|---|"
              awk -F, '{c=$2; sub(/.*\./,"",c); n[c]++; if ($6=="KILLED"||$6=="TIMED_OUT") k[c]++; if ($6=="SURVIVED"||$6=="NO_COVERAGE") s[c]++}
                END {for (c in n) {printf "| %s | %d | %d | %d | %.0f %% |\n", c, n[c], k[c], s[c], 100*k[c]/n[c]; tn+=n[c]; tk+=k[c]; ts+=s[c]}
                     printf "| **Total** | %d | %d | %d | **%.0f %%** |\n", tn, tk, ts, 100*tk/tn}' "$CSV"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier le rapport pitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pitest
          path: tika-core/target/pit-reports/

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: tika-core/target/surefire-reports/
